name: omran_mall
description: "Omran Mall Management System - Flutter Multiplatform Client (Android, iOS, Web)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  
  # Networking & Real-time
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1
  
  # Storage & Offline Cache
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  
  # Location & Geofencing
  geolocator: ^11.0.0
  mobile_scanner: ^7.5.0
  
  # UI & Design
  google_fonts: ^9.0.0
  intl: ^0.20.3
  lucide_icons: ^0.257.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
