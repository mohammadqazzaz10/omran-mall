name: temporary-break-prettier
on:
  push:
    branches:
      - phase-2/break-engine
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx prettier --write src/modules/breaks/breaks.service.spec.ts
      - name: Emit formatted source
        run: |
          echo "FILE_BEGIN"
          base64 -w0 src/modules/breaks/breaks.service.spec.ts
          echo
          echo "FILE_END"
