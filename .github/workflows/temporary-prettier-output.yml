name: temporary-prettier-output
on:
  push:
    branches:
      - phase-1/flutter-auth-admin-ui-v2
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Format the three CI-blocking files
        run: npx prettier --write src/modules/auth/auth.service.spec.ts src/modules/auth/auth.service.ts src/modules/auth/permission.guard.spec.ts
      - name: Package formatted files
        run: tar -czf /tmp/formatted-backend-files.tar.gz src/modules/auth/auth.service.spec.ts src/modules/auth/auth.service.ts src/modules/auth/permission.guard.spec.ts
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-backend-files
          path: /tmp/formatted-backend-files.tar.gz
          if-no-files-found: error
