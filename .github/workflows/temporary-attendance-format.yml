name: Temporary attendance formatting repair

on:
  push:
    branches:
      - feature/section-01-vision-principles

permissions:
  contents: write

concurrency:
  group: attendance-format-repair
  cancel-in-progress: false

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/section-01-vision-principles
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Format the three files blocking CI
        run: npx prettier --write src/modules/attendance/attendance.controller.ts src/modules/attendance/attendance.service.ts src/modules/attendance/attendance.service.spec.ts
      - name: Commit exact Prettier output if needed
        run: |
          if git -C .. diff --quiet; then
            echo "Attendance files already match Prettier."
            exit 0
          fi
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add backend/src/modules/attendance/attendance.controller.ts backend/src/modules/attendance/attendance.service.ts backend/src/modules/attendance/attendance.service.spec.ts
          git -C .. commit -m "style(attendance): apply repository Prettier formatter"
          git -C .. push origin HEAD:feature/section-01-vision-principles
