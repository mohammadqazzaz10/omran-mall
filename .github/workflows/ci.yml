name: quality-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test command
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omran_test
          POSTGRES_USER: omran_test
          POSTGRES_PASSWORD: omran_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omran_test -d omran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://omran_test:omran_test_password@127.0.0.1:5432/omran_test
      NODE_ENV: test
      ALLOW_DEVELOPMENT_SEEDS: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve backend dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
      - name: Apply official NestJS 12 migration
        run: |
          npx nest upgrade --no-observe --skip-install
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
      - uses: actions/upload-artifact@v6
        with:
          name: backend-lockfile
          path: backend/package-lock.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: backend-migration-config
          path: |
            backend/package.json
            backend/tsconfig.json
            backend/tsconfig.build.json
            backend/nest-cli.json
            backend/jest.config.js
          if-no-files-found: error
      - run: npm run format
      - run: npm run build
      - name: Apply checksum migrations and verify guarded development seeds
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
          npm run db:seed
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_test -v ON_ERROR_STOP=1 -f ../database/tests/schema_invariants.sql
          PGPASSWORD=omran_test_password createdb -h 127.0.0.1 -U omran_test omran_existing_schema_test
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_existing_schema_test -v ON_ERROR_STOP=1 -c 'CREATE TABLE sentinel (id INTEGER PRIMARY KEY)'
          if output=$(DATABASE_URL=postgresql://omran_test:omran_test_password@127.0.0.1:5432/omran_existing_schema_test npm run db:migrate 2>&1); then
            echo 'Migration runner unexpectedly accepted an untracked existing schema.'
            exit 1
          else
            echo "$output"
            echo "$output" | grep -q 'existing database schema was found without a migration ledger'
          fi
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_existing_schema_test -tAc "SELECT to_regclass('public.sentinel') IS NOT NULL" | grep -q t
      - name: Audit resolved backend dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities; if (!v) { console.error("npm audit did not return a valid vulnerability report", a.error ?? ""); process.exit(2); } console.log("Dependency vulnerability summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`); if ((v.critical ?? 0) > 0) process.exit(1);'
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('backend/npm-audit.json') != ''
        with:
          name: backend-security-audit
          path: backend/npm-audit.json
          if-no-files-found: error
      - run: npm run format:check
      - uses: actions/upload-artifact@v6
        with:
          name: backend-formatted-source
          path: backend/src/
          if-no-files-found: error
      - run: npm test -- --runInBand
      - name: Validate Docker Compose and build production image
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build -f Dockerfile -t omran-mall-backend:ci ..

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - name: Generate missing Flutter platform projects
        run: |
          if [ ! -d android ] || [ ! -d ios ] || [ ! -d web ] || [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android,ios,web --org com.omranmall --project-name omran_mall --no-pub .
          fi
          if [ -f test/widget_test.dart ] && grep -q 'material_ui' test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          sed -i -e '/^gradle-wrapper\.jar$/d' -e '/^\/gradlew$/d' -e '/^\/gradlew\.bat$/d' android/.gitignore
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - run: flutter analyze --no-fatal-infos
        working-directory: client
      - run: flutter test
        working-directory: client
      - name: Archive generated Flutter platform files with permissions
        run: tar -czf flutter-generated-foundation.tar.gz -C client android ios web .metadata .gitignore pubspec.lock
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-generated-foundation
          path: flutter-generated-foundation.tar.gz
          if-no-files-found: error

  web:
    name: Flutter Web Release build
    needs: [flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - uses: actions/download-artifact@v8
        with:
          name: flutter-generated-foundation
          path: client-generated
      - name: Restore generated Flutter platform project
        run: |
          mkdir -p client
          tar -xzf client-generated/flutter-generated-foundation.tar.gz -C client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - run: flutter build web --release
        working-directory: client
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-web-release
          path: client/build/web/
          if-no-files-found: error
  android:
    name: Android debug build
    needs: [flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
      - uses: actions/download-artifact@v8
        with:
          name: flutter-generated-foundation
          path: client-generated
      - name: Restore generated Flutter platform project
        run: |
          mkdir -p client
          tar -xzf client-generated/flutter-generated-foundation.tar.gz -C client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - name: Build Android Debug APK with verbose Gradle diagnostics
        run: flutter build apk --debug --verbose
        working-directory: client
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  persist-generated-foundation:
    name: Persist generated platforms and dependency lockfiles
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backend-lockfile
          path: backend-lock
      - uses: actions/download-artifact@v8
        with:
          name: backend-migration-config
          path: backend-config
      - uses: actions/download-artifact@v8
        with:
          name: backend-formatted-source
          path: backend-generated
      - uses: actions/download-artifact@v8
        with:
          name: flutter-generated-foundation
          path: client-generated
      - name: Commit generated project files
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p client
          if tar -tzf client-generated/flutter-generated-foundation.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path detected in generated Flutter artifact.'
            exit 1
          fi
          tar --no-same-owner --no-same-permissions -xzf client-generated/flutter-generated-foundation.tar.gz -C client
          cp backend-lock/package-lock.json backend/package-lock.json
          cp backend-config/package.json backend/package.json
          cp backend-config/tsconfig.json backend/tsconfig.json
          cp backend-config/tsconfig.build.json backend/tsconfig.build.json
          cp backend-config/nest-cli.json backend/nest-cli.json
          cp backend-config/jest.config.js backend/jest.config.js
          cp -a backend-generated/. backend/src/
          git add backend/src client/android client/ios client/web client/.metadata client/.gitignore client/pubspec.lock backend/package-lock.json backend/package.json backend/tsconfig.json backend/tsconfig.build.json backend/nest-cli.json backend/jest.config.js
          git add -f client/android/gradlew client/android/gradlew.bat client/android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add Flutter platforms and dependency lockfiles"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
