name: quality-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test command
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omran_test
          POSTGRES_USER: omran_test
          POSTGRES_PASSWORD: omran_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omran_test -d omran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://omran_test:omran_test_password@127.0.0.1:5432/omran_test
      NODE_ENV: test
      ALLOW_DEVELOPMENT_SEEDS: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked backend dependencies
        run: npm ci
      - name: Temporary Prettier formatter probe (remove after capturing output)
        run: |
          npx prettier --write src/modules/attendance/attendance.service.spec.ts
          cat src/modules/attendance/attendance.service.spec.ts
      - run: npm run format:check
      - run: npm run build
      - name: Type-check first-admin bootstrap utility
        run: npm run db:bootstrap-admin:check
      - name: Apply checksum migrations and verify guarded development seeds
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
          npm run db:seed
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_test -v ON_ERROR_STOP=1 -f ../database/tests/schema_invariants.sql
          node scripts/attendance-qr-concurrency.js
          PGPASSWORD=omran_test_password createdb -h 127.0.0.1 -U omran_test omran_existing_schema_test
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_existing_schema_test -v ON_ERROR_STOP=1 -c 'CREATE TABLE sentinel (id INTEGER PRIMARY KEY)'
          if output=$(DATABASE_URL=postgresql://omran_test:omran_test_password@127.0.0.1:5432/omran_existing_schema_test npm run db:migrate 2>&1); then
            echo 'Migration runner unexpectedly accepted an untracked existing schema.'
            exit 1
          else
            echo "$output"
            echo "$output" | grep -q 'existing database schema was found without a migration ledger'
          fi
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_existing_schema_test -tAc "SELECT to_regclass('public.sentinel') IS NOT NULL" | grep -q t
      - name: Audit resolved backend dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities; if (!v) { console.error("npm audit did not return a valid vulnerability report", a.error ?? ""); process.exit(2); } console.log("All-dependency vulnerability summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`); if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);'
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('backend/npm-audit.json') != ''
        with:
          name: backend-security-audit
          path: backend/npm-audit.json
          if-no-files-found: error
      - name: Audit production dependencies separately
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a=require("./npm-audit-production.json"); const v=a.metadata?.vulnerabilities; if (!v) { console.error("Production npm audit did not return a valid report", a.error ?? ""); process.exit(2); } console.log("Production dependency vulnerability summary:", JSON.stringify(v)); if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);'
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('backend/npm-audit-production.json') != ''
        with:
          name: backend-production-security-audit
          path: backend/npm-audit-production.json
          if-no-files-found: error
      - run: npm test -- --runInBand
      - name: Validate Docker Compose and build production image
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build -f Dockerfile -t omran-mall-backend:ci ..

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - name: Generate missing Flutter platform projects
        run: |
          if [ ! -d android ] || [ ! -d ios ] || [ ! -d web ] || [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android,ios,web --org com.omranmall --project-name omran_mall --no-pub .
          fi
          if [ -f test/widget_test.dart ] && grep -q 'material_ui' test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
          sed -i -e '/^gradle-wrapper\.jar$/d' -e '/^\/gradlew$/d' -e '/^\/gradlew\.bat$/d' android/.gitignore
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - run: flutter analyze --no-fatal-infos
        working-directory: client
      - run: flutter test
        working-directory: client
      - name: Archive generated Flutter platform files with permissions
        run: tar -czf flutter-generated-foundation.tar.gz -C client android ios web .metadata .gitignore pubspec.lock
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-generated-foundation
          path: flutter-generated-foundation.tar.gz
          if-no-files-found: error

  web:
    name: Flutter Web Release build
    needs: [flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - uses: actions/download-artifact@v8
        with:
          name: flutter-generated-foundation
          path: client-generated
      - name: Restore generated Flutter platform project
        run: |
          mkdir -p client
          tar -xzf client-generated/flutter-generated-foundation.tar.gz -C client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - run: flutter build web --release
        working-directory: client
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-web-release
          path: client/build/web/
          if-no-files-found: error
  android:
    name: Android debug build
    needs: [flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
      - uses: actions/download-artifact@v8
        with:
          name: flutter-generated-foundation
          path: client-generated
      - name: Restore generated Flutter platform project
        run: |
          mkdir -p client
          tar -xzf client-generated/flutter-generated-foundation.tar.gz -C client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - name: Build Android Debug APK with verbose Gradle diagnostics
        run: flutter build apk --debug --target-platform android-arm64 --verbose
        working-directory: client
      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
