name: quality-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test command
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omran_test
          POSTGRES_USER: omran_test
          POSTGRES_PASSWORD: omran_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omran_test -d omran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://omran_test:omran_test_password@127.0.0.1:5432/omran_test
      NODE_ENV: test
      ALLOW_DEVELOPMENT_SEEDS: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve backend dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit fix || true
          npm ci
      - uses: actions/upload-artifact@v6
        with:
          name: backend-lockfile
          path: backend/package-lock.json
          if-no-files-found: error
      - run: npm run build
      - name: Apply checksum migrations and verify guarded development seeds
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
          npm run db:seed
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_test -v ON_ERROR_STOP=1 -f ../database/tests/schema_invariants.sql
          PGPASSWORD=omran_test_password createdb -h 127.0.0.1 -U omran_test omran_existing_schema_test
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_existing_schema_test -v ON_ERROR_STOP=1 -c 'CREATE TABLE sentinel (id INTEGER PRIMARY KEY)'
          if output=$(DATABASE_URL=postgresql://omran_test:omran_test_password@127.0.0.1:5432/omran_existing_schema_test npm run db:migrate 2>&1); then
            echo 'Migration runner unexpectedly accepted an untracked existing schema.'
            exit 1
          else
            echo "$output"
            echo "$output" | grep -q 'existing database schema was found without a migration ledger'
          fi
          PGPASSWORD=omran_test_password psql -h 127.0.0.1 -U omran_test -d omran_existing_schema_test -tAc "SELECT to_regclass('public.sentinel') IS NOT NULL" | grep -q t
      - name: Audit resolved backend dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities ?? {}; console.log("Dependency vulnerability summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`); if ((v.critical ?? 0) > 0) process.exit(1);'
      - run: npm test -- --runInBand
      - name: Validate Docker Compose and build production image
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build -f Dockerfile -t omran-mall-backend:ci ..

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Generate missing Flutter platform projects
        run: |
          flutter create --platforms=android,ios,web --org com.omranmall --project-name omran_mall --no-pub .
          if [ -f test/widget_test.dart ] && grep -q 'material_ui' test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then rm -f test/widget_test.dart; fi
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      - run: flutter analyze --no-fatal-infos
        working-directory: client
      - run: flutter test
        working-directory: client
      - run: flutter build web --release
        working-directory: client
      - run: flutter build apk --debug
        working-directory: client
      - name: Archive generated Flutter platform files with permissions
        run: tar -czf flutter-generated-foundation.tar.gz -C client android ios web .metadata .gitignore pubspec.lock
      - uses: actions/upload-artifact@v6
        with:
          name: flutter-generated-foundation
          path: flutter-generated-foundation.tar.gz
          if-no-files-found: error

  persist-generated-foundation:
    name: Persist generated platforms and dependency lockfiles
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backend-lockfile
          path: backend-lock
      - uses: actions/download-artifact@v8
        with:
          name: flutter-generated-foundation
          path: client-generated
      - name: Commit generated project files
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p client
          tar -xzf client-generated/flutter-generated-foundation.tar.gz -C client
          cp backend-lock/package-lock.json backend/package-lock.json
          git add client/android client/ios client/web client/.metadata client/.gitignore client/pubspec.lock backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add Flutter platforms and dependency lockfiles"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
