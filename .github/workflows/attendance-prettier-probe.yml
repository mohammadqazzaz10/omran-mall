name: temporary-attendance-prettier-probe

on:
  pull_request:
    paths:
      - '.github/workflows/attendance-prettier-probe.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked backend dependencies
        run: npm ci
        working-directory: backend
      - name: Format and print the exact attendance test file
        run: |
          npx prettier --write src/modules/attendance/attendance.service.spec.ts
          cat src/modules/attendance/attendance.service.spec.ts
        working-directory: backend
