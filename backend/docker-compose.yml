services:
  omran-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-omran_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:-omran_mall_db}
      TZ: Asia/Amman
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-omran_admin} -d ${DB_NAME:-omran_mall_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [omran-network]

  omran-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [omran-network]

  omran-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: builder
    restart: unless-stopped
    command: ["sh", "-c", "npm run db:migrate && npm run start:dev"]
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in backend/.env}
      ALLOW_DEVELOPMENT_SEEDS: ${ALLOW_DEVELOPMENT_SEEDS:-false}
      DB_HOST: omran-postgres
      REDIS_HOST: omran-redis
      TZ: Asia/Amman
    depends_on:
      omran-postgres:
        condition: service_healthy
      omran-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [omran-network]

volumes:
  pgdata:
  redisdata:

networks:
  omran-network:
    driver: bridge
